    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f2fbf5',
                100: '#e1f7e8',
                500: '#1DB954', 
                600: '#19a34a',
                700: '#14853d',
              },
              brand: '#1DB954',
              sportGreen: '#1DB954',
              darkGreen: '#0E1A13',
              bgMain: '#0A0B10', 
              bgSurface: '#FFFFFF',
              textMain: '#1A1C1E',
              textMuted: '#BFC7C2',
              navBg: '#0E1320',
            },
            fontFamily: {
              sans: ['Inter', 'Poppins', 'sans-serif'],
            },
            borderRadius: {
              'xl': '1rem',
              '2xl': '1.25rem',
              '3xl': '1.5rem',
              '4xl': '2rem',
              '5xl': '2.5rem',
            },
            boxShadow: {
              'premium': '0 20px 50px -15px rgba(0, 0, 0, 0.3)',
              'button': '0 8px 25px -5px rgba(29, 185, 84, 0.5)',
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',

    <style>
        body {
            background-color: #F8F9FD;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        
        .dark body {
            background-color: #0A0B10;
            color: #FFFFFF;
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Nav Animations */
        @keyframes daviplay-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(29, 185, 84, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(29, 185, 84, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(29, 185, 84, 0.4); }
        }
        .animate-daviplay {
            animation: daviplay-pulse 3s infinite ease-in-out;
        }

        .glass-nav {
            background: linear-gradient(180deg, rgba(23, 29, 45, 0.95) 0%, rgba(14, 19, 32, 0.98) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @keyframes icon-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .active-icon-anim {
            animation: icon-bounce 0.4s ease-out;
        }

        /* iOS Transition Emulation */
        @keyframes ios-slide-up {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in-up {
            animation: ios-slide-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .ios-scroller {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ios-scroller::-webkit-scrollbar {
            display: none;
        }

        @keyframes sun-glow {
            0%, 100% { filter: blur(40px) brightness(1); }
            50% { filter: blur(60px) brightness(1.2); }
        }
    </style>
