    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#fff1f0',
                100: '#ffdfdc',
                500: '#FF6452', 
                600: '#e55a4a',
                700: '#b2463a',
              },
              brand: '#FF6452',
              bgMain: '#0A0B10', 
              bgSurface: '#FFFFFF',
              textMain: '#1A1C1E',
              textMuted: '#8E9196',
              navBg: '#0E1320',
            },
            fontFamily: {
              sans: ['Poppins', 'Inter', 'sans-serif'],
            },
            borderRadius: {
              '3xl': '1.5rem',
              '4xl': '2rem',
              '5xl': '2.5rem',
            },
            boxShadow: {
              'premium': '0 10px 40px -10px rgba(0, 0, 0, 0.12)',
              'button': '0 8px 25px -5px rgba(255, 100, 82, 0.45)',
              'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
              'nav-glow': '0 -5px 20px -5px rgba(255, 100, 82, 0.15)',
              'daviplay': '0 0 25px 0px rgba(255, 100, 82, 0.5)',
            }
          }
        }
      }

    <style>
        body {
            background-color: #0A0B10;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Nav Animations */
        @keyframes daviplay-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 100, 82, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 100, 82, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 100, 82, 0.4); }
        }
        .animate-daviplay {
            animation: daviplay-pulse 3s infinite ease-in-out;
        }

        .glass-nav {
            background: linear-gradient(180deg, rgba(23, 29, 45, 0.95) 0%, rgba(14, 19, 32, 0.98) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @keyframes icon-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .active-icon-anim {
            animation: icon-bounce 0.4s ease-out;
        }
    </style>
